name: Project Security Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  privacy-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run privacy compliance gate
        run: node tools/privacy-gate/privacy-gate.mjs

  endpoint-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platforms/gcp/cloud-ingest/package-lock.json
      - name: Install Cloud Function dependencies
        working-directory: platforms/gcp/cloud-ingest
        run: npm ci
      - name: Run endpoint authentication gate
        run: node tools/security-gate/security-gate.mjs
      - name: Run penetration-test regression gate
        run: node tools/pentest-gate/pentest-gate.mjs
      - name: Run accessibility regression gate
        run: node tools/accessibility-gate/accessibility-gate.mjs
      - name: Test authentication controls
        working-directory: platforms/gcp/cloud-ingest
        run: npm test
      - name: Test Firestore authorization rules
        working-directory: platforms/gcp
        run: npx --yes firebase-tools@15.30.0 emulators:exec --only firestore --project demo-cwb-security-rules "npm --prefix cloud-ingest run test:rules"

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check first-party JavaScript syntax
        run: git ls-files -z '*.js' '*.mjs' '*.cjs' ':!:node_modules/**' ':!:**/node_modules/**' ':!:vendor/**' ':!:**/vendor/**' | xargs -0 -n1 node --check

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Check firmware
        run: python -m platformio check --project-dir firmware --skip-packages --src-filters '+<src/>' --silent

  dependencies:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - .
          - platforms/gcp/cloud-ingest
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - name: Audit all dependencies
        run: npm audit --audit-level=high
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Generate CycloneDX SBOMs
        shell: bash
        run: |
          npm sbom --sbom-format cyclonedx > sbom-root.cdx.json
          npm --prefix platforms/gcp/cloud-ingest sbom --sbom-format cyclonedx > sbom-cloud-ingest.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cwb-sbom
          path: sbom-*.cdx.json
          retention-days: 30
          if-no-files-found: error
