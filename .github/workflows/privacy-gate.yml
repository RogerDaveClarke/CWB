name: Privacy Compliance Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  privacy-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run privacy compliance gate
        run: node tools/privacy-gate/privacy-gate.mjs
